<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MoveWell: sports gear, footwear and health essentials for an active lifestyle, in one store and one cart."
    />
    <title>MoveWell: everything for active living</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230f766e'/%3E%3Ctext x='50' y='70' font-size='62' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EM%3C/text%3E%3C/svg%3E"
    />
    <!-- Self-hosted fonts (src/fonts.css); preload the two faces above the fold. -->
    <link
      rel="preload"
      href="/fonts/barlow-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/oswald-500-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Theme-before-paint: see docs/specs.md §10g. Deliberately outside React —
      // this is the only way to guarantee zero flash regardless of hydration timing.
      (function () {
        try {
          // Stored by writeStorage() as JSON, e.g. "\"dark\"" (quotes included).
          var raw = localStorage.getItem("fitarena:theme");
          var stored = raw ? JSON.parse(raw) : null; // "light" | "dark" | "system" | null
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            stored === "light" || stored === "dark"
              ? stored
              : systemDark
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = resolved;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <script>
      // Home page only: start downloading the first hero photo (the largest
      // paint) before the JavaScript bundle arrives. Other pages skip it.
      if (location.pathname === "/") {
        var hero = document.createElement("link");
        hero.rel = "preload";
        hero.as = "image";
        hero.type = "image/webp";
        hero.setAttribute("fetchpriority", "high");
        hero.setAttribute("imagesizes", "100vw");
        hero.setAttribute(
          "imagesrcset",
          "/images/site/hero-battle-ropes-640.webp 640w, /images/site/hero-battle-ropes-1280.webp 1280w, /images/site/hero-battle-ropes-1920.webp 1920w"
        );
        document.head.appendChild(hero);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
